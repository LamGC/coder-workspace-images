name: Publish Images

concurrency:
  group: publish-images-and-templates
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sundays at 02:00 UTC

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: lamgc
  IMAGE_NAME: coder-workspace-images

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build-base: ${{ steps.detect.outputs.build-base }}
      has-others: ${{ steps.detect.outputs.has-others }}
      matrix: ${{ steps.detect.outputs.matrix }}
      timestamp: ${{ steps.detect.outputs.timestamp }}
      has-tf-changes: ${{ steps.detect.outputs.has-tf-changes }}
      tf-matrix: ${{ steps.detect.outputs.tf-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed images and generate timestamp
        id: detect
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          # All dependent images; add new image folder names here to extend the pipeline
          DEPENDENT_IMAGES="ubuntu-dotnet ubuntu-web ubuntu-rust ubuntu-golang ubuntu-java"
          ALL_TEMPLATE_DIRS="ubuntu-base ubuntu-dotnet ubuntu-web ubuntu-rust ubuntu-golang ubuntu-java"

          # Scheduled and manually dispatched runs publish a complete release.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build-base=true" >> $GITHUB_OUTPUT
            echo "has-others=true" >> $GITHUB_OUTPUT
            MATRIX='[]'
            for IMG in $DEPENDENT_IMAGES; do
              MATRIX=$(echo "$MATRIX" | jq -c --arg img "$IMG" --arg ctx "$IMG" '. + [{"image": $img, "context": $ctx}]')
            done
            TF_MATRIX='[]'
            for DIR in $ALL_TEMPLATE_DIRS; do
              TF_MATRIX=$(echo "$TF_MATRIX" | jq -c --arg tmpl "$DIR" --arg dir "$DIR" '. + [{"template": $tmpl, "directory": $dir}]')
            done
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has-tf-changes=true" >> $GITHUB_OUTPUT
            echo "tf-matrix=$TF_MATRIX" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push, force-push, or before-commit no longer exists in history —
            # fall back to diffing against the immediate parent commit
            CHANGED=$(git diff --name-only HEAD^..HEAD 2>/dev/null || git show --name-only --format="" HEAD)
          else
            CHANGED=$(git diff --name-only "$BEFORE".."${{ github.sha }}")
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Base or publication pipeline changes require a complete release.
          BASE_CHANGED=false
          if echo "$CHANGED" | grep -qE '^(ubuntu-base/|\.github/workflows/publish\.yml$)'; then
            BASE_CHANGED=true
          fi

          # If ubuntu-base changed, rebuild all; otherwise only rebuild changed images
          MATRIX='[]'
          HAS_OTHERS=false
          for IMG in $DEPENDENT_IMAGES; do
            if [ "$BASE_CHANGED" = "true" ] || echo "$CHANGED" | grep -q "^${IMG}/"; then
              HAS_OTHERS=true
              MATRIX=$(echo "$MATRIX" | jq -c --arg img "$IMG" --arg ctx "$IMG" '. + [{"image": $img, "context": $ctx}]')
            fi
          done

          # Publish a template whenever its image inputs change.
          # All template directories (including ubuntu-base which also has a main.tf)
          TF_MATRIX='[]'
          HAS_TF=false
          for DIR in $ALL_TEMPLATE_DIRS; do
            if [ "$BASE_CHANGED" = "true" ] || echo "$CHANGED" | grep -q "^${DIR}/"; then
              HAS_TF=true
              TF_MATRIX=$(echo "$TF_MATRIX" | jq -c --arg tmpl "$DIR" --arg dir "$DIR" '. + [{"template": $tmpl, "directory": $dir}]')
            fi
          done

          echo "build-base=$BASE_CHANGED" >> $GITHUB_OUTPUT
          echo "has-others=$HAS_OTHERS" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has-tf-changes=$HAS_TF" >> $GITHUB_OUTPUT
          echo "tf-matrix=$TF_MATRIX" >> $GITHUB_OUTPUT

  publish-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.build-base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ubuntu-base
        uses: docker/build-push-action@v5
        with:
          context: ubuntu-base
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:ubuntu-base-latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:ubuntu-base-${{ needs.detect-changes.outputs.timestamp }}
          cache-from: type=gha,scope=ubuntu-base
          cache-to: type=gha,scope=ubuntu-base,mode=max

  publish-others:
    needs: [detect-changes, publish-base]
    if: always() && !failure() && !cancelled() && needs.detect-changes.outputs.has-others == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable base image
        id: base-image
        run: |
          if [ "${{ needs.detect-changes.outputs.build-base }}" = "true" ]; then
            BASE_TAG="ubuntu-base-${{ needs.detect-changes.outputs.timestamp }}"
          else
            BASE_TAG="ubuntu-base-latest"
          fi
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${BASE_TAG}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$DIGEST" in sha256:*) ;; *) echo "Invalid base image digest: $DIGEST" >&2; exit 1 ;; esac
          echo "value=${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          build-args: BASE=${{ steps.base-image.outputs.value }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-${{ needs.detect-changes.outputs.timestamp }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  publish-templates:
    needs: [detect-changes, publish-base, publish-others]
    # Publish only after all required image builds have succeeded.
    if: always() && !failure() && !cancelled() && needs.detect-changes.outputs.has-tf-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.tf-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable workspace image
        id: workspace-image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${{ matrix.template }}-${{ needs.detect-changes.outputs.timestamp }}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$DIGEST" in sha256:*) ;; *) echo "Invalid image digest: $DIGEST" >&2; exit 1 ;; esac
          echo "value=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Prepare Coder template bundle
        id: template-bundle
        env:
          TEMPLATE_DIR: ${{ matrix.directory }}
        run: |
          BUNDLE_DIR="${RUNNER_TEMP}/coder-template-${{ matrix.template }}"
          mkdir -p "$BUNDLE_DIR"
          cp "$TEMPLATE_DIR"/*.tf "$BUNDLE_DIR/"
          if compgen -G "$TEMPLATE_DIR/*.tf.json" >/dev/null; then cp "$TEMPLATE_DIR"/*.tf.json "$BUNDLE_DIR/"; fi
          if [ -f "$TEMPLATE_DIR/.terraform.lock.hcl" ]; then cp "$TEMPLATE_DIR/.terraform.lock.hcl" "$BUNDLE_DIR/"; fi
          terraform -chdir="$BUNDLE_DIR" init -backend=false -input=false
          echo "directory=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Coder CLI
        env:
          CODER_URL: ${{ secrets.CODER_URL }}
        run: curl -fsSL "${CODER_URL%/}/install.sh" | sh

      - name: Push Coder template — ${{ matrix.template }}
        env:
          CODER_SESSION_TOKEN: ${{ secrets.CODER_CLI_TOKEN }}
          CODER_URL: ${{ secrets.CODER_URL }}
          TEMPLATE_BUNDLE: ${{ steps.template-bundle.outputs.directory }}
          WORKSPACE_IMAGE: ${{ steps.workspace-image.outputs.value }}
        run: |
          coder templates push "${{ matrix.template }}" \
            --directory "$TEMPLATE_BUNDLE" \
            --variable "workspace_image=$WORKSPACE_IMAGE" \
            --yes
